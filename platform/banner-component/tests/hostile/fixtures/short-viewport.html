<!doctype html><html><head><meta charset="utf-8"><title>short viewport</title>
<!-- Not a hostility fixture: exercises the short-viewport delivery
     behaviors (run.mjs probes it with phone emulation, not the shared
     900×700 probe). Landscape-phone tap must go DIRECT to the LP
     (no overlay, CTA pixel fired); a portrait-opened reader must
     auto-close when the phone rotates to landscape. -->
</head><body>
<div style="height:40px"></div>
<div id="slot" style="width:300px;height:250px;"></div>
<script src="/dist/expandable-magazine-banner.js"></script>
<script>
  (function () {
    var PAGES = [
      { bg: "#1a1a2e", layout: [
        { type: "text", text: "SHORT VIEWPORT", left: 8, top: 20, width: 84, fontSize: 13, color: "#f5c518", fontWeight: 800 },
      ]},
      { bg: "#2d132c", layout: [
        { type: "text", text: "Page 2", left: 8, top: 44, width: 84, fontSize: 11, color: "#fff", fontWeight: 700 },
      ]},
      { bg: "#0b3d2e", layout: [
        { type: "text", text: "Page 3", left: 8, top: 44, width: 84, fontSize: 11, color: "#fff", fontWeight: 700 },
      ]},
    ];
    var el = document.createElement("expandable-magazine-banner");
    el.setAttribute("pages", JSON.stringify(PAGES));
    el.setAttribute("width", "300");
    el.setAttribute("height", "250");
    el.setAttribute("landing-url", "/tests/hostile/fixtures/_lp.html");
    el.setAttribute("cta-url", "/tests/hostile/fixtures/_ctapixel.gif");
    document.getElementById("slot").appendChild(el);
  })();
</script>
</body></html>
